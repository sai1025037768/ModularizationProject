plugins {
    id 'travel.android.library'
}

android {
    namespace = 'com.travel.feature.home'
}

dependencies {

    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation project(':core-navigation')
    implementation project(':core-ui')
    implementation project(':core-model')

    implementation project(':core-network')
    implementation project(path: ':feature-home-api')
    implementation project(path: ':feature-accommodation-api')
    implementation project(path: ':feature-transportation-api')
    implementation project(path: ':feature-attraction-api')


    implementation(libs.arouter.api) {
        exclude group: 'com.android.support', module: 'support-v4'
    }
    compileOnly libs.android.support.v4
    annotationProcessor libs.arouter.compiler
}
