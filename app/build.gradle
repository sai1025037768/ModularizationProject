plugins {
    id 'travel.android.application'
}

android {
    namespace = 'com.travel.app'

    defaultConfig {
        applicationId = "com.travel.app"
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation project(':feature-home-api')
    implementation project(':feature-home')

    implementation project(':feature-accommodation')
    implementation project(':feature-transportation')
    implementation project(':feature-attraction')
    implementation project(':core-storage')

    implementation project(':core-navigation')
    implementation project(':platform-navigation-arouter')
    implementation project(':core-network')
}
