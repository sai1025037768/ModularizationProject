plugins {
    id 'travel.android.feature'
}

android {
    namespace = 'com.travel.feature.accommodation'

    defaultConfig {
        resourcePrefix = "accommodation_"
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation libs.androidx.constraintlayout
    implementation project(path: ':core-navigation')
    implementation project(path: ':core-ui')
    implementation project(path: ':core-model')

    implementation project(path: ':core-network')
    implementation project(path: ':feature-accommodation-api')
    implementation project(path: ':feature-attraction-api')


    implementation(libs.arouter.api) {
        exclude group: 'com.android.support', module: 'support-v4'
    }
    compileOnly libs.android.support.v4
    implementation libs.retrofit
    implementation libs.rxandroid
    annotationProcessor libs.arouter.compiler

}
