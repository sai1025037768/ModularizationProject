plugins {
    id 'travel.android.library'
}

android {
    namespace = 'com.travel.core.dependencies'
}

dependencies {
    api fileTree(include: ['*.jar'], dir: 'libs')

    api libs.rxandroid

    api libs.retrofit
    api libs.retrofit.adapter.rxjava

    api libs.stetho
    api libs.stetho.okhttp3

    api libs.okhttp3
    api libs.okhttp3.logging.interceptor

    api libs.fastjson
    api libs.ormlite.android
}
