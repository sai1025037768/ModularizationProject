apply plugin: 'com.android.library'

android {
    namespace 'com.modularization.opensourcelibrary'
    compileSdkVersion 35

    defaultConfig {
        targetSdkVersion 35
        minSdkVersion 19
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    api fileTree(include: ['*.jar'], dir: 'libs')

    api 'io.reactivex:rxandroid:1.2.1'

    api rootProject.ext.dependencies["retrofit"]
    api rootProject.ext.dependencies["adapter-rxjava"]

    api rootProject.ext.dependencies["stetho"]
    api rootProject.ext.dependencies["stetho-okhttp3"]

    api rootProject.ext.dependencies["okhttp3"]
    api rootProject.ext.dependencies["okhttp3-logging-interceptor"]

    api rootProject.ext.dependencies["fastjson"]
    api rootProject.ext.dependencies["ormlite-android"]
}
